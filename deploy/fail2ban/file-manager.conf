# fail2ban: фильтр неудачных входов файлообменника.
# Строка в журнале приложения: [auth] неудачный вход: логин="admin" ip=1.2.3.4
# Установка: см. docs/DEPLOY_FASTPANEL.md → «Безопасность».
[Definition]
failregex = \[auth\] неудачный вход: логин=.* ip=<HOST>$
            \[auth\] неудачный вход WebDAV ip=<HOST>$
            \[auth\] неверный код 2FA: \S+ ip=<HOST>$
ignoreregex =
