<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Файлообменник</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/share-page.js"></script>
</head>
<body class="login-bg min-h-screen">
  <main class="mx-auto flex min-h-screen w-full max-w-2xl flex-col px-4 py-10">
    <header class="mb-8 flex items-center justify-center gap-2.5">
      <img id="brand-logo" src="/favicon.svg" alt="" class="h-8 w-8 rounded-lg object-contain">
      <span id="brand-name" class="font-semibold tracking-tight">Файлообменник</span>
    </header>
    <div id="share" class="card p-6 shadow-lg shadow-slate-900/5" aria-live="polite">
      <div class="h-24 animate-pulse rounded-xl bg-slate-100 dark:bg-slate-800"></div>
    </div>
    <p id="share-foot" class="mt-4 text-center text-xs text-slate-500 dark:text-slate-400"></p>
  </main>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4" aria-live="assertive"></div>
</body>
</html>
