<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Файлообменник</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="h-dvh overflow-hidden">
  <div class="flex h-full">
    <!-- ===== Левая панель: навигация + дерево диска ===== -->
    <aside id="sidebar"
           class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:static lg:w-64 lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900"
           aria-label="Навигация">
      <div class="flex h-16 shrink-0 items-center justify-between gap-2 px-4">
        <a href="#/" class="flex items-center gap-2.5 font-semibold tracking-tight">
          <img src="/favicon.svg" alt="" class="h-8 w-8">
          Файлообменник
        </a>
        <button id="sidebar-close" class="icon-btn lg:hidden" type="button" aria-label="Закрыть меню"></button>
      </div>

      <div class="px-3 pb-2">
        <button id="palette-open" type="button" class="flex w-full items-center gap-2.5 rounded-lg border border-slate-200 px-3 py-1.5 text-sm text-slate-500 transition-colors hover:border-slate-300 hover:text-slate-700 dark:border-slate-800 dark:text-slate-400 dark:hover:border-slate-700 dark:hover:text-slate-200" aria-keyshortcuts="Control+K">
          <span id="palette-icon" class="inline-flex"></span>
          <span class="flex-1 text-left">Найти…</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
      </div>

      <nav class="space-y-0.5 px-3" id="main-nav">
        <a href="#/" data-nav="home" class="nav-link"></a>
        <a href="#/users" data-nav="users" data-role="admin" class="nav-link"></a>
        <a href="#/settings" data-nav="settings" class="nav-link"></a>
      </nav>

      <div id="favorites" class="hidden px-3 pt-4" aria-labelledby="favorites-title">
        <p id="favorites-title" class="px-1 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Избранное</p>
        <ul id="favorites-list" class="space-y-0.5 text-sm"></ul>
      </div>

      <div class="mx-4 my-4 border-t border-slate-200 dark:border-slate-800"></div>

      <div class="flex items-center justify-between px-4 pb-1">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Диск</span>
        <button id="tree-new-folder" class="icon-btn h-7 w-7" type="button" data-role="editor" title="Новая папка" aria-label="Новая папка"></button>
      </div>
      <div id="tree" class="min-h-0 flex-1 overflow-y-auto px-2 pb-3 text-sm" role="tree" aria-label="Папки диска"></div>

      <div class="space-y-3 border-t border-slate-200 p-4 dark:border-slate-800">
        <div id="storage-summary" class="text-xs text-slate-500 dark:text-slate-400">&nbsp;</div>
        <div class="flex items-center gap-3">
          <span id="user-avatar" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold uppercase text-brand-700 dark:bg-brand-900 dark:text-brand-200"></span>
          <div class="min-w-0 flex-1">
            <p id="user-name" class="truncate text-sm font-medium"></p>
            <p id="user-role" class="text-xs text-slate-500 dark:text-slate-400"></p>
          </div>
          <button id="logout" class="icon-btn" type="button" title="Выйти" aria-label="Выйти"></button>
        </div>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="fixed inset-0 z-30 hidden bg-slate-900/40 backdrop-blur-[1px] lg:hidden"></div>

    <!-- ===== Основная область ===== -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-200 bg-white/80 px-4 backdrop-blur sm:px-6 dark:border-slate-800 dark:bg-slate-950/80">
        <button id="sidebar-open" class="icon-btn -ml-2 lg:hidden" type="button" aria-label="Открыть меню"></button>
        <div id="page-title" class="min-w-0 flex-1"></div>
        <div id="page-actions" class="flex shrink-0 items-center gap-2"></div>
      </header>

      <div id="storage-banner" class="hidden items-center gap-3 border-b border-amber-200 bg-amber-50 px-4 py-2.5 text-sm text-amber-800 sm:px-6 dark:border-amber-900 dark:bg-amber-950/50 dark:text-amber-200" role="status"></div>
      <div class="flex min-h-0 flex-1">
        <main id="view" class="relative min-w-0 flex-1 overflow-y-auto" tabindex="-1"></main>

        <!-- ===== Правая панель: предпросмотр ===== -->
        <aside id="preview"
               class="fixed inset-y-0 right-0 z-40 hidden w-full translate-x-full flex-col border-l border-slate-200 bg-white transition-transform duration-200 sm:w-[26rem] xl:static xl:z-auto xl:w-[24rem] xl:translate-x-0 dark:border-slate-800 dark:bg-slate-900"
               aria-label="Предпросмотр файла"></aside>
        <div id="preview-backdrop" class="fixed inset-0 z-30 hidden bg-slate-900/40 xl:hidden"></div>
      </div>
    </div>
  </div>

  <!-- Очередь загрузок -->
  <section id="uploads" class="fixed bottom-4 right-4 z-50 hidden w-[min(24rem,calc(100%-2rem))] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2.5 dark:border-slate-800">
      <h2 id="uploads-title" class="text-sm font-semibold" role="status" aria-live="polite">Загрузка</h2>
      <button id="uploads-hide" class="icon-btn h-7 w-7" type="button" aria-label="Скрыть"></button>
    </div>
    <ul id="upload-list" class="max-h-72 divide-y divide-slate-100 overflow-y-auto dark:divide-slate-800"></ul>
  </section>

  <input id="file-input" type="file" multiple class="sr-only" tabindex="-1" aria-hidden="true">
  <input id="folder-input" type="file" multiple webkitdirectory class="sr-only" tabindex="-1" aria-hidden="true">
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4" aria-live="assertive"></div>
  <div id="chart-tooltip" class="pointer-events-none fixed z-[70] hidden rounded-lg bg-slate-900 px-3 py-2 text-xs text-white shadow-lg dark:bg-white dark:text-slate-900" role="tooltip"></div>
</body>
</html>
