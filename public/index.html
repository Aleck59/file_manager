<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Файлообменник</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="min-h-screen">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
      <a href="/" class="flex items-center gap-2.5 font-semibold tracking-tight">
        <img src="/favicon.svg" alt="" class="h-8 w-8">
        Файлообменник
      </a>
      <button id="logout" class="btn-ghost" type="button">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="hidden sm:inline">Выйти</span>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl space-y-6 px-4 py-6 sm:py-10">
    <!-- Зона загрузки -->
    <section aria-labelledby="upload-title">
      <h2 id="upload-title" class="sr-only">Загрузка файлов</h2>
      <label id="dropzone" for="file-input"
             class="group flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 bg-white px-6 py-12 text-center transition hover:border-brand-400 hover:bg-brand-50/50 dark:border-slate-700 dark:bg-slate-900 dark:hover:border-brand-600 dark:hover:bg-brand-950/30">
        <span class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-600 transition group-hover:scale-105 dark:bg-brand-950 dark:text-brand-400">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20.4 15.6A5 5 0 0 0 18 6h-1.3A8 8 0 1 0 4 14.3"/></svg>
        </span>
        <span class="text-base font-medium">Перетащите файлы сюда</span>
        <span class="mt-1 text-sm text-slate-500 dark:text-slate-400">или <span class="font-medium text-brand-600 underline-offset-2 group-hover:underline dark:text-brand-400">выберите на компьютере</span></span>
        <span class="mt-3 text-xs text-slate-400 dark:text-slate-500">Файлы загружаются напрямую в хранилище S3</span>
        <input id="file-input" type="file" multiple class="sr-only">
      </label>

      <ul id="upload-list" class="mt-4 space-y-2" aria-live="polite"></ul>
    </section>

    <!-- Список файлов -->
    <section class="card overflow-hidden" aria-labelledby="files-title">
      <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between dark:border-slate-800">
        <div>
          <h2 id="files-title" class="font-semibold">Мои файлы</h2>
          <p id="files-summary" class="text-sm text-slate-500 dark:text-slate-400">Загрузка…</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Поиск" aria-label="Поиск по имени" class="input w-44 py-1.5 pl-9">
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
            <span class="hidden sm:inline">Ссылка на</span>
            <select id="link-ttl" class="select" aria-label="Срок действия ссылки">
              <option value="3600">1 час</option>
              <option value="86400" selected>24 часа</option>
              <option value="604800">7 дней</option>
            </select>
          </label>
          <button id="refresh" class="icon-btn" type="button" title="Обновить" aria-label="Обновить список">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
          </button>
        </div>
      </div>

      <div class="hidden grid-cols-[1fr_7rem_10rem_8.5rem] gap-4 border-b border-slate-200 px-4 py-2 text-xs font-medium uppercase tracking-wide text-slate-400 sm:grid dark:border-slate-800">
        <span>Имя</span><span class="text-right">Размер</span><span>Дата</span><span class="text-right">Действия</span>
      </div>
      <ul id="file-list" class="divide-y divide-slate-100 dark:divide-slate-800"></ul>

      <div id="empty-state" class="hidden px-6 py-16 text-center">
        <p class="font-medium">Здесь пока пусто</p>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Загрузите первый файл — он появится в этом списке.</p>
      </div>
      <div id="list-skeleton" class="space-y-3 p-4" aria-hidden="true">
        <div class="h-10 animate-pulse rounded-lg bg-slate-100 dark:bg-slate-800"></div>
        <div class="h-10 animate-pulse rounded-lg bg-slate-100 dark:bg-slate-800"></div>
        <div class="h-10 animate-pulse rounded-lg bg-slate-100 dark:bg-slate-800"></div>
      </div>
      <div id="load-more-wrap" class="hidden border-t border-slate-200 p-3 text-center dark:border-slate-800">
        <button id="load-more" class="btn-ghost" type="button">Показать ещё</button>
      </div>
    </section>
  </main>

  <!-- Подтверждение удаления -->
  <dialog id="confirm-dialog" class="w-[min(28rem,calc(100%-2rem))] rounded-2xl bg-white p-0 text-slate-800 shadow-xl dark:bg-slate-900 dark:text-slate-200">
    <form method="dialog" class="p-6">
      <h3 class="text-lg font-semibold">Удалить файл?</h3>
      <p class="mt-2 break-all text-sm text-slate-500 dark:text-slate-400">
        Файл <strong id="confirm-name" class="font-medium text-slate-800 dark:text-slate-200"></strong> будет удалён без возможности восстановления. Выданные ссылки перестанут работать.
      </p>
      <div class="mt-6 flex justify-end gap-2">
        <button value="cancel" class="btn-ghost" autofocus>Отмена</button>
        <button value="confirm" class="btn-danger">Удалить</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="assertive"></div>

  <template id="file-row">
    <li class="grid grid-cols-[1fr_auto] items-center gap-x-4 gap-y-1 px-4 py-3 transition hover:bg-slate-50 sm:grid-cols-[1fr_7rem_10rem_8.5rem] dark:hover:bg-slate-800/40">
      <div class="flex min-w-0 items-center gap-3">
        <span data-ext class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-[10px] font-semibold uppercase text-slate-500 dark:bg-slate-800 dark:text-slate-400"></span>
        <div class="min-w-0">
          <p data-name class="truncate text-sm font-medium"></p>
          <p data-meta class="text-xs text-slate-500 sm:hidden dark:text-slate-400"></p>
        </div>
      </div>
      <span data-size class="hidden text-right text-sm tabular-nums text-slate-500 sm:block dark:text-slate-400"></span>
      <span data-date class="hidden text-sm text-slate-500 sm:block dark:text-slate-400"></span>
      <div class="flex justify-end gap-0.5">
        <button data-action="download" class="icon-btn" type="button" title="Скачать" aria-label="Скачать">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button data-action="copy" class="icon-btn" type="button" title="Скопировать ссылку для скачивания" aria-label="Скопировать ссылку">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </button>
        <button data-action="delete" class="icon-btn-danger" type="button" title="Удалить" aria-label="Удалить">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </li>
  </template>

  <template id="upload-row">
    <li class="card px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline justify-between gap-3">
            <p data-name class="truncate text-sm font-medium"></p>
            <span data-status class="shrink-0 text-xs tabular-nums text-slate-500 dark:text-slate-400"></span>
          </div>
          <div class="progress mt-2"><div data-bar class="w-0"></div></div>
        </div>
        <button data-action="cancel" class="icon-btn" type="button" title="Отменить" aria-label="Отменить загрузку">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </li>
  </template>
</body>
</html>
